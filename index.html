<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kanban — My Board</title>
  <meta name="description" content="A tiny offline-first Kanban board. No server, no build step.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6ef7'/%3E%3Crect x='7' y='8' width='4.5' height='16' rx='2' fill='white'/%3E%3Crect x='14' y='8' width='4.5' height='11' rx='2' fill='white' opacity='.85'/%3E%3Crect x='21' y='8' width='4.5' height='14' rx='2' fill='white' opacity='.7'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme and text size before first paint to avoid a flash.
    try {
      var theme = localStorage.getItem('herok-kanban-theme');
      if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;

      var size = localStorage.getItem('herok-kanban-size') || 'large';
      if (['compact', 'comfortable', 'large', 'xlarge', 'huge'].indexOf(size) === -1) size = 'large';
      document.documentElement.dataset.size = size;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="booting">

<section id="auth-screen" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="currentColor" opacity=".14"></rect>
        <rect x="7" y="8" width="4.5" height="16" rx="2" fill="currentColor"></rect>
        <rect x="14" y="8" width="4.5" height="11" rx="2" fill="currentColor" opacity=".75"></rect>
        <rect x="21" y="8" width="4.5" height="14" rx="2" fill="currentColor" opacity=".55"></rect>
      </svg>
      <span>Kanban</span>
    </div>

    <div id="auth-form-wrap">
      <h1>Sign in</h1>
      <p class="auth-sub">Enter the email and password for this board.</p>

      <form id="auth-form" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="auth-email" type="email" autocomplete="username" inputmode="email"
                 autocapitalize="off" spellcheck="false" placeholder="you@example.com" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="auth-password" type="password" autocomplete="current-password"
                 placeholder="Your password" required>
        </label>
        <button id="auth-submit" class="btn btn-primary auth-submit" type="submit">Sign in</button>
      </form>

      <p id="auth-error" class="auth-error" role="alert" hidden></p>
    </div>

    <p class="auth-note">Your board lives in Supabase and syncs to every device you sign in on.</p>
  </div>
</section>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="currentColor" opacity=".14"></rect>
      <rect x="7" y="8" width="4.5" height="16" rx="2" fill="currentColor"></rect>
      <rect x="14" y="8" width="4.5" height="11" rx="2" fill="currentColor" opacity=".75"></rect>
      <rect x="21" y="8" width="4.5" height="14" rx="2" fill="currentColor" opacity=".55"></rect>
    </svg>
    <span>Kanban</span>
  </div>

  <div class="search">
    <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
      <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
      <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
    <input id="search" type="search" placeholder="Search cards…  ( / )" autocomplete="off" aria-label="Search cards">
    <button id="search-clear" class="search-clear" type="button" title="Clear search" hidden>×</button>
  </div>

  <div class="actions">
    <div class="size-stepper" role="group" aria-label="Text size">
      <button id="size-down" class="step-btn" type="button" title="Smaller text" aria-label="Smaller text">A−</button>
      <button id="size-up" class="step-btn" type="button" title="Larger text" aria-label="Larger text">A+</button>
    </div>
    <button id="theme-toggle" class="btn btn-icon" type="button" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    <div class="menu-wrap">
      <button id="menu-btn" class="btn btn-icon" type="button" title="More options" aria-label="More options">⋯</button>
      <div id="menu" class="menu" hidden>
        <button type="button" data-action="add-column">+ New column</button>
        <div class="menu-sep"></div>
        <button type="button" data-action="export">Export JSON</button>
        <button type="button" data-action="import">Import JSON</button>
        <div class="menu-sep"></div>
        <button type="button" data-action="signout">Sign out</button>
        <button type="button" data-action="reset" class="danger">Reset board</button>
        <div class="menu-note" id="sync-note">Connecting…</div>
      </div>
    </div>
  </div>
</header>

<main id="board" class="board" aria-label="Kanban board"></main>

<footer class="foot">
  <span id="sync-pill" class="sync-pill">Connecting…</span>
  <span>Cloud board — export a backup now and then.</span>
  <span class="keys"><kbd>N</kbd> new card <kbd>/</kbd> search</span>
</footer>

<!-- Card editor -->
<dialog id="card-dialog" class="sheet" aria-labelledby="card-dialog-title">
  <form id="card-form" class="sheet-form" method="dialog" novalidate>
    <header class="sheet-head">
      <h2 id="card-dialog-title">New card</h2>
      <button type="button" class="btn btn-icon" data-close aria-label="Close">✕</button>
    </header>

    <label class="field">
      <span>Title</span>
      <input name="title" type="text" maxlength="200" autocomplete="off" placeholder="What needs doing?" required>
    </label>

    <label class="field">
      <span>Notes</span>
      <textarea name="notes" rows="4" maxlength="4000" placeholder="Details, links, next steps…"></textarea>
    </label>

    <label class="field">
      <span>Column</span>
      <select name="columnId" id="card-column"></select>
    </label>

    <div class="field">
      <span>Color</span>
      <div class="swatches" id="card-colors" role="radiogroup" aria-label="Card color"></div>
    </div>

    <label class="field field-half">
      <span>Due date</span>
      <input name="dueDate" type="date">
    </label>

    <footer class="sheet-foot">
      <button type="button" id="card-delete" class="btn btn-danger" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </footer>
  </form>
</dialog>

<!-- Column editor -->
<dialog id="column-dialog" class="sheet sheet-sm" aria-labelledby="column-dialog-title">
  <form id="column-form" class="sheet-form" method="dialog" novalidate>
    <header class="sheet-head">
      <h2 id="column-dialog-title">New column</h2>
      <button type="button" class="btn btn-icon" data-close aria-label="Close">✕</button>
    </header>

    <label class="field">
      <span>Name</span>
      <input name="title" type="text" maxlength="40" autocomplete="off" placeholder="Column name" required>
    </label>

    <div class="field">
      <span>Color</span>
      <div class="swatches" id="column-colors" role="radiogroup" aria-label="Column color"></div>
    </div>

    <footer class="sheet-foot">
      <button type="button" id="column-delete" class="btn btn-danger" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </footer>
  </form>
</dialog>

<button id="fab" class="fab" type="button" aria-label="New card" title="New card (N)">
  <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
    <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"></path>
  </svg>
</button>

<input type="file" id="import-file" accept="application/json,.json" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>
  <p style="padding:24px;font-family:system-ui">This board needs JavaScript to run.</p>
</noscript>

<script src="src/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="src/store.js"></script>
<script src="src/drag.js"></script>
<script src="src/board.js"></script>
<script src="src/sync.js"></script>
<script src="src/app.js"></script>
</body>
</html>
